<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Details - Search System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .search-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            text-align: left;
            display: none;
        }
        .error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="search-container">
    <h2>यूज़र डिटेल्स खोजें</h2>
    <input type="text" id="phoneInput" placeholder="फ़ोन नंबर दर्ज करें (e.g. 8482915363)">
    <button onclick="searchUser()">खोजें (Search)</button>

    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <strong>नाम:</strong> <span id="resName"></span><br><br>
        <strong>डिटेल्स:</strong> <span id="resDetails"></span><br><br>
        <strong>स्टेटस/URL:</strong> <span id="resStatus"></span>
    </div>
</div>

<!-- सुरक्षित और आसान फ़ायरबेस स्क्रिप्ट्स (जो सीधे कंप्यूटर पर भी चलेंगी) -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // आपकी फ़ायरबेस कॉन्फ़िगरेशन डिटेल्स
    const firebaseConfig = {
        apiKey: "AIzaSyAzCILK4qWjGYvkZX0Y4SUtCqduJNA0Njk",
        authDomain: "://firebaseapp.com",
        projectId: "image-to-details",
        storageBucket: "image-to-details.firebasestorage.app",
        messagingSenderId: "648004942829",
        appId: "1:648004942829:web:0120e9bc16317bba38c5e4",
        measurementId: "G-E20PGF578T"
    };

    // फ़ायरबेस को शुरू करें
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // सर्च फ़ंक्शन
    async function searchUser() {
        const phone = document.getElementById("phoneInput").value.trim();
        const errorMsg = document.getElementById("errorMsg");
        const resultBox = document.getElementById("resultBox");

        errorMsg.innerText = "";
        resultBox.style.display = "none";

        if (!phone) {
            errorMsg.innerText = "कृपया एक फ़ोन नंबर डालें!";
            return;
        }

        try {
            // 'users' कलेक्शन से डेटा खोजना
            const docRef = db.collection("users").doc(phone);
            const docSnap = await docRef.get();

            if (docSnap.exists) {
                const userData = docSnap.data();
                
                // डेटा को स्क्रीन पर दिखाना
                document.getElementById("resName").innerText = userData.name || "उपलब्ध नहीं";
                document.getElementById("resDetails").innerText = userData.details || "उपलब्ध नहीं";
                document.getElementById("resStatus").innerText = userData.status || userData.image_url || "उपलब्ध नहीं";
                
                resultBox.style.display = "block";
            } else {
                errorMsg.innerText = "इस नंबर का कोई डेटा नहीं मिला!";
            }
        } catch (error) {
            console.error("Error fetching document:", error);
            errorMsg.innerText = "डेटा खोजने में कोई दिक्कत आई है।";
        }
    }
</script>

</body>
</html>
